CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
# The default 768-byte log thread stack overflows once Wi-Fi and the
# protocol stack log together, and messages are silently dropped.
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_LOG_BUFFER_SIZE=4096

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_POSIX_API=y

# TASK 1 - the same four capability symbols as the HTTP lab, with one changed.
# Guide section 0 says which.
# Tarea 1: Subsistemas requeridos
CONFIG_WIFI=y
CONFIG_MQTT_LIB=y
CONFIG_JSON_LIBRARY=y
CONFIG_LED_STRIP=y

# Requisitos de Red e IP para MQTT
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y

# Credenciales de Wi-Fi
CONFIG_LAB_WIFI_SSID="changeme"
CONFIG_LAB_WIFI_PSK="changeme"

# Tarea 2: Dirección y Puerto del Broker MQTT
CONFIG_LAB_BROKER_ADDR="192.168.1.7"
CONFIG_LAB_BROKER_PORT=1883